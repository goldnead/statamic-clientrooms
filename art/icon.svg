<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B0764" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a door with a nameplate. The room is opened by the first purchase and
       kept when the access runs out, and it belongs to one named client — a
       door is the only glyph that says "yours, and it stays" in one silhouette.
       Two figures inside the frame would read as a restroom sign at 32px; the
       nameplate carries "one room per person" without that risk. Nothing else
       in the suite is a door. -->
  <g filter="url(#sh)">
    <path d="M166 430 V224 A90 90 0 0 1 346 224 V430 Z" fill="#FFFFFF"/>
  </g>

  <!-- the nameplate: small and high, or the door reads as a postbox with a slot -->
  <rect x="216" y="186" width="80" height="28" rx="14" fill="url(#bg)"/>

  <!-- the handle -->
  <circle cx="314" cy="330" r="15" fill="url(#bg)"/>
</svg>
