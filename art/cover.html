<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #581C87 0%, #3B0764 55%, #0B0512 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #E9D5FF; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #A855F7; box-shadow: 0 0 18px #A855F7; }
  h1 { font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#E9D5FF,#C084FC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #E9D5FF; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #A855F747, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Client Rooms</span></h1>
      <p class="sub">One lasting room per coaching client, opened by the first purchase.</p>
      <div class="badges">
        <span class="badge">Tasks</span>
        <span class="badge">Signed downloads</span>
        <span class="badge">Timeline</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A855F7"/><stop offset="1" stop-color="#6B21A8"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B0764" flood-opacity="0.34"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a door with a nameplate: the room is opened by the first purchase,
             kept afterwards, and belongs to one named client. -->
        <g filter="url(#sh)">
          <path d="M166 430 V224 A90 90 0 0 1 346 224 V430 Z" fill="#FFFFFF"/>
        </g>
        <rect x="216" y="186" width="80" height="28" rx="14" fill="url(#bg)"/>
        <circle cx="314" cy="330" r="15" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
